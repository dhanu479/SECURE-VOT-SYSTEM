<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SecureVote Icon">
  <defs>
    <filter id="ico-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="ico-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7b5ea7;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="ico-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0f1129;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a1a;stop-opacity:1"/>
    </radialGradient>
    <clipPath id="ico-clip">
      <path d="M32 6 L54 16 L54 34 C54 48 32 58 32 58 C32 58 10 48 10 34 L10 16 Z"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#ico-bg)" stroke="url(#ico-grad)" stroke-width="1"/>

  <!-- Shield -->
  <path d="M32 8 L52 17 L52 35 C52 47 32 57 32 57 C32 57 12 47 12 35 L12 17 Z"
        fill="rgba(0,245,255,0.06)" stroke="url(#ico-grad)" stroke-width="1.5"
        filter="url(#ico-glow)"/>

  <!-- Circuit lines -->
  <g clip-path="url(#ico-clip)" opacity="0.4" stroke="#00f5ff" stroke-width="0.6" fill="none">
    <line x1="12" y1="22" x2="28" y2="22"/>
    <line x1="36" y1="22" x2="52" y2="22"/>
    <line x1="12" y1="32" x2="52" y2="32"/>
    <line x1="12" y1="42" x2="22" y2="42"/>
    <line x1="42" y1="42" x2="52" y2="42"/>
    <line x1="22" y1="15" x2="22" y2="42"/>
    <line x1="42" y1="15" x2="42" y2="42"/>
    <circle cx="22" cy="22" r="1.5" fill="#00f5ff"/>
    <circle cx="42" cy="22" r="1.5" fill="#00f5ff"/>
    <circle cx="22" cy="32" r="1.5" fill="#00f5ff"/>
    <circle cx="42" cy="32" r="1.5" fill="#00f5ff"/>
  </g>

  <!-- Checkmark -->
  <polyline points="24,34 30,42 42,26"
            fill="none" stroke="#00f5ff" stroke-width="2.8"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#ico-glow)"/>

  <!-- Scan animation -->
  <rect x="12" y="8" width="40" height="2" fill="#00f5ff" opacity="0" rx="1">
    <animate attributeName="y" from="8" to="57" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0" dur="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>
